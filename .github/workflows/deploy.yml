name: Deploy Energy Dashboard to tota2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev
          
      - name: Install rsconnect
        run: |
          Rscript -e '
            install.packages(
              "rsconnect",
              lib = Sys.getenv("R_LIBS_USER"),
              repos = c(CRAN = Sys.getenv("RSPM"))
            )

            packageVersion("rsconnect")
          '
          
      # Installs all R packages needed
      - name: Install R Package Dependencies
        run: |
          Rscript -e 'install.packages(c("bslib", "dplyr", "fresh", "ggplot2", "httr", "leaflet", "plotly", "readr", "bcmaps", "sf", "shiny", "shinydashboard", "stringr", "tidyr", "jsonlite"))'

      - name: Authenticate and deploy to tota2
        env:
          RSCONNECT_CLIENT_ID: ${{ secrets.RSCONNECT_CLIENT_ID }}
          RSCONNECT_CLIENT_SECRET: ${{ secrets.RSCONNECT_CLIENT_SECRET }}
        run: |
          Rscript -e '
            .libPaths(c(Sys.getenv("R_LIBS_USER"), .libPaths()))

            library(rsconnect)
            rsconnect::connectCloudClientCredentials(
              clientId = Sys.getenv("RSCONNECT_CLIENT_ID"),
              clientSecret = Sys.getenv("RSCONNECT_CLIENT_SECRET"),
              accountName = "tota2"
            )

            rsconnect::deployApp(
              appDir = ".",
              appId = "01a1f4b5-4e8b-7c1c-8d2f-3c78be67f851",
              account = "tota2",
              forceUpdate = TRUE,
              logLevel = "verbose"
            )
          '
